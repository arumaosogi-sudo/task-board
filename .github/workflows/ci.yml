name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-verify:
    name: Install โ’ Typecheck โ’ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace-aware, reproducible)
        run: npm ci

      # @prisma/client types must exist before tsc runs across the workspace.
      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint
        # Real ESLint 9 (flat config, typescript-eslint) via `turbo lint` โ’ `eslint src`
        # in each workspace. Errors fail CI; react-hooks/no-explicit-any surface as
        # non-blocking warnings. Prettier is available via `npm run format[:check]` but
        # is intentionally NOT gated here yet โ€” the repo predates it and a one-time
        # `npm run format` pass is deferred to its own PR to keep diffs reviewable.

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      # Unit/integration tests run before build to fail fast on logic errors.
      # Prisma Client was generated above, so api tests can touch Prisma types.
      - name: Test (all workspaces)
        run: npm run test

      - name: Build (all workspaces)
        run: npm run build

  api-integration:
    name: API integration tests (real Postgres)
    runs-on: ubuntu-latest
    needs: install-and-verify
    timeout-minutes: 15
    # Ephemeral Postgres just for this job โ€” created fresh, thrown away after.
    # NEVER points at DATABASE_URL / Supabase; the suite TRUNCATEs every table.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Consumed by jest.integration.config.js โ’ env-setup.ts / global-setup.ts.
      # global-setup creates the anon/authenticated roles and runs
      # `prisma migrate deploy` against this DB before the specs run.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskboard_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (workspace-aware, reproducible)
        run: npm ci

      # @prisma/client types + engine must exist before migrate/tests run.
      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Migrations are applied by the suite's globalSetup (after it creates the
      # anon/authenticated roles the RLS migration REVOKEs from โ€” those don't
      # exist on a vanilla Postgres, so migrate must not run before them).
      - name: Integration tests (real Postgres, serial)
        run: npm run test:int

  docker-build-check:
    name: Docker images build (sanity check, not pushed)
    runs-on: ubuntu-latest
    needs: install-and-verify
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=https://api.placeholder.invalid
            VITE_COLLAB_URL=wss://api.placeholder.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max
