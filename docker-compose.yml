services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The RLS migration REVOKEs from Supabase's `anon` / `authenticated` roles,
      # which a vanilla postgres image does not have — without this, the documented
      # first run (`prisma migrate deploy`, and the api container's own entrypoint)
      # dies with: role "anon" does not exist. The image runs everything in this
      # directory on FIRST init only, so an existing `pgdata` volume needs either
      # `docker compose down -v` or a one-off:
      #   docker compose exec -T db psql -U taskboard -d taskboard \
      #     < ops/scripts/sql/create-test-roles.sql
      - ./ops/scripts/sql/create-test-roles.sql:/docker-entrypoint-initdb.d/00-supabase-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Image already declares this HEALTHCHECK (apps/api/Dockerfile); repeated
      # here so `depends_on: condition: service_healthy` on `web` has an
      # explicit contract even if someone swaps the built image later.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: 3001
      # Local stack uses the bundled Postgres; no pooler needed.
      DATABASE_URL: postgresql://taskboard:taskboard@db:5432/taskboard
      DIRECT_URL: postgresql://taskboard:taskboard@db:5432/taskboard
      WEB_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      # NOT the literal "change-me-..." placeholder from .env.example — the API
      # refuses to boot on that value (apps/api/src/config/validate-secrets.ts
      # rejects any secret starting with "change-me", found while wiring the
      # local test sandbox: this compose file's api service would not have
      # started). These are still local-dev-only, not real secrets.
      JWT_SECRET: local-dev-docker-compose-jwt-access-secret-not-for-prod
      JWT_REFRESH_SECRET: local-dev-docker-compose-jwt-refresh-secret-not-for-prod
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 30d
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@taskboard.local
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        # Collab shares the API's own port/server now (see CollabService).
        VITE_COLLAB_URL: ws://localhost:3001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
