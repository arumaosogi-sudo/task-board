server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx:alpine defaults already have these on; stated explicitly so the
  # intent survives a base-image change. sendfile lets the kernel stream
  # static files without an extra userspace copy; etag (weak, mtime+size
  # based) lets browsers do conditional GETs / 304s on revalidation.
  sendfile on;
  etag on;

  # Long-cache fingerprinted assets — filenames are content-hashed by Vite,
  # so a new deploy ships new filenames and this is always safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is the one file whose *content* changes on every deploy while
  # its URL stays constant. Force revalidation on every request so a deploy
  # is visible immediately instead of waiting out a browser's heuristic
  # cache (nginx sends no Cache-Control by default, which some browsers/CDNs
  # cache anyway based on Last-Modified/ETag heuristics).
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA fallback: every unknown path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Railway's edge does TLS termination but does NOT compress the origin
  # response for us — without this, every visitor downloads the ~475KB
  # main chunk (and CSS/other JS) uncompressed. gzip_comp_level 5 is the
  # standard sweet spot (levels above ~6 cost meaningfully more CPU for
  # marginal extra savings on already-minified JS/CSS).
  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  # Stock nginx:alpine has no brotli module compiled in (would require a
  # custom image build) — gzip only, intentionally, per perf/load-speed scope.
}
